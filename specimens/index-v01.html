<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圆脸汉字 · 试字台</title><style>
@font-face{font-family:Mood;src:url('../fonts/MoodHanziPrototype-Regular.woff2') format('woff2');font-weight:400;font-display:swap}*{box-sizing:border-box}body{margin:0;background:#f7f3e8;color:#193e34;font-family:system-ui,sans-serif}main{max-width:1050px;margin:60px auto;padding:0 24px}small{letter-spacing:.12em;color:#687d70}h1{font-size:42px;font-weight:550}p{line-height:1.8}textarea{width:100%;min-height:100px;padding:20px;background:#fffdf7;border:1px solid #c4ccbc;border-radius:16px;font:20px system-ui;color:#193e34}label{display:block;margin:20px 0}#preview{font-family:Mood,serif;font-size:88px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap;padding:30px 0;font-synthesis:none}#status{color:#815826}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}.card{background:#fffdf7;border:1px solid #e4dfd1;border-radius:14px;padding:15px;text-align:center}.glyph{font:78px Mood;line-height:1.4}.label{font-size:13px;color:#687d70}a{color:inherit}.missing{font-family:system-ui;font-size:.45em;color:#a5482b;border-bottom:2px dotted #a5482b}.foot{margin:40px 0;color:#687d70;font-size:14px}
</style><main><small>MOOD HANZI / DESIGN STUDY 01</small><h1>让汉字有一点小表情。</h1><p>24 个汉字的方向样稿。保留汉字结构，探索圆脸、圆角和轻微手写起伏。当前仅供设计评审。</p><label for="input">输入试排文字（未收录的字会单独标记）</label><textarea id="input">日月星光，山水木心。</textarea><label for="size">字号 <output id="value">88</output> px　<input id="size" type="range" min="24" max="140" value="88"></label><p id="status" aria-live="polite"></p><div id="preview" aria-label="字体预览"></div><h2>已收录字形</h2><div id="grid"></div><p class="foot"><a href="../fonts/MoodHanziPrototype-Regular.ttf" download>下载本地 TTF 原型</a> · <a href="../README.md">项目说明</a><br>AI 辅助设计原型；未完成商业发行审核。数字和英文字母尚未设计。缺字不是字体安装故障。</p></main><script>
const chars='日月山水木火土田人大小上下中天口目心云雨生王星光。，！？';
const supported=new Set([...chars,' ','\n','\t']);
const input=document.getElementById('input'), preview=document.getElementById('preview'), statusEl=document.getElementById('status');
function render(){preview.replaceChildren();let missing=new Set();for(const c of input.value){if(supported.has(c)){preview.append(document.createTextNode(c));}else{missing.add(c);let span=document.createElement('span');span.className='missing';span.textContent=c;span.title='原型未收录，当前显示系统字形';preview.append(span);}}statusEl.textContent=missing.size?'未收录：'+[...missing].join(' ')+'（橙色字使用系统字体，不能代表本字体效果）':'此段全部字符已收录。';}
input.addEventListener('input',render);document.getElementById('size').addEventListener('input',e=>{document.getElementById('value').value=e.target.value;preview.style.fontSize=e.target.value+'px';});
for(const ch of chars){const card=document.createElement('div');card.className='card';const g=document.createElement('div');g.className='glyph';g.textContent=ch;const label=document.createElement('div');label.className='label';label.textContent=ch+' · U+'+ch.codePointAt(0).toString(16).toUpperCase();card.append(g,label);document.getElementById('grid').append(card);}render();
document.fonts.load('88px Mood','日').catch(()=>{statusEl.textContent='字体加载失败，请在项目根目录运行 python3 -m http.server 8765，再访问 /specimens/。';});
</script></html>
